[workspace]
resolver = "3"
members = ["apps/api", "crates/core", "crates/persistence"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-AI-Keyless-Pending"
repository = "https://github.com/itsh-neumeier/ai-keyless"
publish = false
rust-version = "1.88"

[workspace.dependencies]
akl-core = { path = "crates/core" }
akl-persistence = { path = "crates/persistence" }
axum = "0.8"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "fs", "set-header", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
