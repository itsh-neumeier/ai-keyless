# Lab-Overlay für den PC des Projektverantwortlichen (LAN mit UNVR).
# Start:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.lab.yaml \
#     --env-file deploy/compose/.env up -d
# Fügt einen lokalen Ollama-Server mit NVIDIA-GPU hinzu. In AI-Keyless unter
# „KI-Modelle“ als Provider eintragen: Typ Ollama, URL http://ollama:11434
# (Docker-internes Netz, private Adresse → von der SSRF-Richtlinie erlaubt).
# Voraussetzung: NVIDIA-Treiber + NVIDIA Container Toolkit (Linux) bzw.
# Docker Desktop mit WSL2-GPU-Unterstützung (Windows). Siehe docs/operations/LAB-SETUP.md.

services:
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Ein Modell gleichzeitig im VRAM (T600: 4 GB).
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # Kontext begrenzen: Ollama wählte auf der T600 16384 Token; der KV-Cache
      # dafür passte nicht mehr in 4 GB VRAM → Modell lief zu 100 % auf der CPU
      # (gemessen 2026-10-27, ~27 s je Bildtest). Flash-Attention + q8_0-Cache
      # halbieren den KV-Speicher zusätzlich.
      OLLAMA_CONTEXT_LENGTH: "${AKL_OLLAMA_CONTEXT:-8192}"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
    volumes:
      - akl-ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Nur im internen Netz; kein Port nach außen.
    networks: [default]

volumes:
  akl-ollama:
